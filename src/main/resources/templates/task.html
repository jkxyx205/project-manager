<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="includes/base :: common_header(~{},~{::link},~{::style})">
    <link rel="stylesheet" th:href="@{/css/tab-common.css}">
    <style>
        #followup-table {
            font-size: 13px;
        }
        #followup-table thead th {
            white-space: nowrap;
            background-color: #f0f3f8;
            vertical-align: middle;
        }
        #followup-table td {
            vertical-align: middle;
        }
        .col-code { width: 90px; }
        .col-company { min-width: 120px; }
        .col-company a { font-weight: 600; color: #2f353a; }
        .col-country { width: 90px; }
        .col-contact { width: 90px; }
        .col-status { width: 90px; }
        .col-comm { width: 110px; }
        .col-latest-time { white-space: nowrap; width: 130px; }
        .col-interval { text-align: center; width: 70px; }
        .col-next-plan {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .col-next-time { white-space: nowrap; width: 150px; }
        .col-next-time .country-time { color: #5c6c7c; font-size: 12px; }
        .table-empty {
            padding: 40px;
            text-align: center;
            color: #999;
        }
    </style>
</head>
<body class="app">
<th:block th:replace="includes/base :: common_content(~{::div})">
    <div class="container-fluid" style="padding-bottom: 80px;">
        <div class="card">
            <div class="card-body">
                <table class="table table-hover table-bordered mb-0" id="followup-table">
                    <thead>
                    <tr>
                        <th class="col-code">客户编号</th>
                        <th class="col-company">客户</th>
                        <th class="col-country">国家</th>
                        <th class="col-contact">联系人</th>
                        <th class="col-status">所属阶段</th>
                        <th class="col-comm">最近一次跟进沟通方式</th>
                        <th class="col-latest-time">最近一次跟进时间<br><small>（中国时间）</small></th>
                        <th class="col-interval">跟进间隔时间<br><small>（天）</small></th>
                        <th class="col-next-plan">下一次跟进计划</th>
                        <th class="col-next-time">下一次跟进时间<br><small>（中国时间 + 客户国家时间）</small></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="10" class="table-empty">暂无跟进数据</td>
                    </tr>
                    <tr th:each="row : ${rows}" th:data-customer="${row.customerId}">
                        <td class="col-code" th:text="${row.code}">C001</td>
                        <td class="col-company">
                            <a href="javascript:void(0)" th:text="${row.name}">公司</a>
                        </td>
                        <td class="col-country" th:text="${row.countryName != null ? row.countryName : '—'}">国家</td>
                        <td class="col-contact" th:text="${row.contactName != null ? row.contactName : '—'}">联系人</td>
                        <td class="col-status" th:text="${row.statusLabel}">阶段</td>
                        <td class="col-comm" th:text="${row.latestCommunication}">沟通方式</td>
                        <td class="col-latest-time" th:text="${row.latestTimeStr}">时间</td>
                        <td class="col-interval" th:text="${row.intervalDays}">—</td>
                        <td class="col-next-plan" th:text="${row.nextPlanDescription}"
                            th:title="${row.nextPlanDescription}">无</td>
                        <td class="col-next-time">
                            <div th:text="${row.nextTimeChinaStr}">中国时间</div>
                            <div class="country-time" th:if="${row.nextTimeCountryStr != '—'}"
                                 th:text="${row.countryName != null ? row.countryName + ' ' + row.nextTimeCountryStr : row.nextTimeCountryStr}">国家时间</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>

<th:block th:replace="includes/base :: common_js(~{::script})">
    <script th:inline="javascript">
        const customerFormId = /*[[${customerFormId}]]*/ null

        $('#followup-table').on('click', '.col-company a', function () {
            const $tr = $(this).closest('tr')
            const id = $tr.data('customer')
            const name = $(this).text()
            openOnNewTab('customer_' + id, '/forms/page/' + customerFormId + '/' + id, name)
        })
    </script>
</th:block>
</body>
</html>
