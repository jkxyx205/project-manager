server:
  servlet:
    session:
      timeout: -1
spring:
  profiles:
    active: dev

  messages:
    basename: static/i18n/messages #相对路径 开头请勿添加斜杠
    useCodeAsDefaultMessage: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
  cache:
    jcache:
      config: classpath:ehcache.xml
  mobile:
    devicedelegatingviewresolver:
      enabled: false # 必须开启才能使用devicedelegatingviewresolver功能
      #     normalPrefix: normal/
      mobilePrefix: mobile/
      tabletPrefix: tablet/
      enableFallback: true # 有问题
    sitepreference: # 参数
      enabled: false # 开启,可以指定参数
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  mail:  # SMTP 发邮件
    host: smtp.qiye.aliyun.com
    port: 25
    username: xxx
    password: xxx
    default-encoding: UTF-8
    imap: # IMAP 收邮件
      host: imap.qiye.aliyun.com
      port: 143
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
sharp:
  database: # 多个包扫描用 , 隔开
    entity-base-package: com.rick.manager.module.**.entity

dict:
  items:
    - type: bol
      map: { "1": "是", "0": "否" }
    - type: sys_user
      sql: "select id, name from sys_user order by id asc"
    - type: sys_role
      sql: "select id, name from sys_role order by id asc"
    - type: sys_dict_type
      sql: "select distinct type, type from sys_dict order by type asc"

    - type: sys_dict_category
      sql: "select name, label from sys_dict where type = 'PRODUCT_TYPE' order by sort asc"
    - type: sys_dict_supplier
      sql: "select id, name from t_supplier"
    - type: sys_dict_customer
      sql: "select id, name from t_customer"
    - type: "t_country"
      sql: "select id, cname name, case when continent_id = 1 then '亚洲' when continent_id = 2 then '欧洲' when continent_id = 3 then '非洲' when continent_id = 4 then '大洋洲' when continent_id = 6 then '北美洲' when continent_id = 7 then '南美洲' end parent_name from t_country order by continent_id"
    - type: "CUSTOMER_TAG"
      sql: "select name as id, label as name, case type when 'CUSTOMER_INTENT' then '客户意向' when 'ORDER_TYPE' then '订单类型' when 'PURCHASE_SCALE' then '采购规模' when 'TRADE_STATUS' then '交易状态' when 'PRODUCT_CATEGORY' then '产品品类' when 'CERTIFICATION' then '认证关注' when 'TARGET_MARKET' then '目标市场' when 'CURRENCY_PREFERENCE' then '币种偏好' when 'LOGISTICS_FOCUS' then '物流关注' when 'PRICE_TENDENCY' then '价格倾向' when 'NEGOTIATION_TERMS' then '谈判条件' when 'CUSTOMER_ROLE' then '客户角色' when 'RISK_FLAG' then '风险标记' when 'ACQUISITION_CHANNEL' then '获客渠道' when 'COMMUNICATION_LANGUAGE' then '沟通语言' when 'CUSTOMER_TRAIT' then '客户特点' end parent_name from sys_dict where type in ('CUSTOMER_INTENT','ORDER_TYPE','PURCHASE_SCALE','TRADE_STATUS','PRODUCT_CATEGORY','CERTIFICATION','TARGET_MARKET','CURRENCY_PREFERENCE','LOGISTICS_FOCUS','PRICE_TENDENCY','NEGOTIATION_TERMS','CUSTOMER_ROLE','RISK_FLAG','ACQUISITION_CHANNEL','COMMUNICATION_LANGUAGE','CUSTOMER_TRAIT') order by field(type,'CUSTOMER_INTENT','ORDER_TYPE','PURCHASE_SCALE','TRADE_STATUS','PRODUCT_CATEGORY','CERTIFICATION','TARGET_MARKET','CURRENCY_PREFERENCE','LOGISTICS_FOCUS','PRICE_TENDENCY','NEGOTIATION_TERMS','CUSTOMER_ROLE','RISK_FLAG','ACQUISITION_CHANNEL','COMMUNICATION_LANGUAGE','CUSTOMER_TRAIT'), sort"

#props:
#  items: {"t_country": "select id, cname name, case when continent_id = 1 then '亚洲' when continent_id = 2 then '欧洲' when continent_id = 3 then '非洲' when continent_id = 4 then '大洋洲' when continent_id = 6 then '北美洲' when continent_id = 7 then '南美洲' end parent_name from t_country order by continent_id"}

app:
  version: v2026.03.14.3
  domain: product-manager.xhope.top
